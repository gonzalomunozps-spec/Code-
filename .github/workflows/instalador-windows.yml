name: Instalador de Windows

# Construye el Setup.exe en una maquina WINDOWS de GitHub y lo deja para
# descargar. Existe porque un ejecutable de Windows NO se puede generar desde
# otro sistema: PyInstaller empaqueta el interprete de la maquina en la que
# corre, e Inno Setup solo existe para Windows. Asi se obtiene el instalador sin
# necesidad de tener un PC con Windows a mano.
#
# COMO USARLO
#   - A mano: pestana "Actions" -> "Instalador de Windows" -> "Run workflow".
#     Al terminar, el Setup.exe esta en "Artifacts", al pie de la ejecucion.
#   - Automatico: al publicar una etiqueta v* (por ejemplo v1.13.0), ademas se
#     adjunta el instalador a la Release.

on:
  workflow_dispatch:          # boton para lanzarlo cuando quieras
  push:
    tags: ["v*"]              # y al etiquetar una version

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la version del programa
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import version; print(version.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Dependencias del programa + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Todo lo que el ejecutable debe llevar dentro. tkinter ya viene con
          # el Python de Windows, no se instala con pip.
          pip install earthengine-api tkintermapview pillow matplotlib requests `
                      reportlab openpyxl platformdirs keyring

      - name: Empaquetar el programa (PyInstaller)
        run: python empaquetar.py

      - name: Comprobar que el ejecutable existe
        shell: bash
        run: test -f dist/MonitorParcelas/MonitorParcelas.exe

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construir el instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.v }} instalador_windows.iss

      - name: Publicar el Setup.exe como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: MonitorParcelas-Setup-${{ steps.ver.outputs.v }}
          path: Output/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Adjuntarlo a la Release (solo al etiquetar una version)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
